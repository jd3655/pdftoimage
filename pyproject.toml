[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftoimage"
version = "0.1.0"
description = "PDF/Image to PNG converter with MarkItDown backend"
readme = "README.md"
authors = [{ name = "Local" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "gradio",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "aiofiles",
    "pdf2image",
    "pillow",
    "opencv-python",
    "numpy",
    "pillow-heif",
    "markitdown[all]",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "openai",
]

[project.scripts]
pdftoimage = "pdftoimage.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["pdftoimage"]
py-modules = ["processing", "markitdown_processing", "utils", "app"]
include-package-data = true

[tool.setuptools.package-data]
pdftoimage = ["web/dist/**/*"]
